<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <h1>ARENA PROGRESSION</h1>
    </div>
    <div class="segment-badge">{{ segment3Count() }} Champions terminés</div>

    <div class="navbar-search">
      <div class="search-wrapper">
        <svg
          class="search-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          placeholder="Chercher un champion..."
          [(ngModel)]="searchQuery"
          (input)="onSearch()"
          class="search-input"
        />
        @if (searchQuery()) {
        <button class="clear-btn" (click)="onClearSearch()" aria-label="Effacer la recherche">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        }
      </div>
    </div>
  </div>
</nav>
